<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Train Tycoon MVP</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      background: #0f1115;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #f5f5f5;
    }
    .panel {
      background: rgba(15, 17, 21, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    #top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    #bank-balance {
      font-weight: 700;
      font-size: 18px;
    }
    button {
      background: #4c7dff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #4a4f61;
      cursor: not-allowed;
    }
    #station-panel {
      position: absolute;
      right: 16px;
      top: 16px;
      width: 260px;
      pointer-events: auto;
    }
    #shop-panel {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 280px;
      display: none;
      pointer-events: auto;
    }
    .shop-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 14px;
    }
    .legend {
      font-size: 12px;
      margin-top: 8px;
      color: #a8b0c2;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">
      <div id="top-bar" class="panel">
        <div>Banque: <span id="bank-balance">0</span> €</div>
        <button id="shop-button">Ouvrir le Shop</button>
      </div>
      <div id="station-panel" class="panel">
        <h3>Détails Station</h3>
        <div id="station-details">Cliquez sur une station.</div>
      </div>
      <div id="shop-panel" class="panel">
        <h3>Shop - Trains</h3>
        <div class="shop-row">
          <div>Train léger</div>
          <div>20 000 €</div>
        </div>
        <div class="shop-row">
          <div>Vitesse 90 | Capacité 40</div>
        </div>
        <button id="buy-train-button" style="margin-top: 10px;">Acheter un train</button>
        <div class="legend">Coût maintenance: 12 €/s | Carburant: 300 €/trajet</div>
      </div>
    </div>
  </div>

  <script>
    class Station {
      constructor(scene, id, name, x, y, resource, demand, color) {
        this.scene = scene;
        this.id = id;
        this.name = name;
        this.x = x;
        this.y = y;
        this.resource = resource;
        this.demand = demand;
        this.stock = 50;
        this.basePrice = 120;
        this.marketSaturation = 0;
        this.sprite = scene.add.circle(x, y, 18, color).setDepth(2).setInteractive();
        this.label = scene.add.text(x - 24, y + 20, name, { fontSize: "12px", color: "#e5e5e5" });
      }

      produce(delta) {
        this.stock = Math.min(200, this.stock + delta * 0.02);
        this.marketSaturation = Math.min(1, this.marketSaturation + delta * 0.00002);
      }

      getBuyPrice() {
        const saturationImpact = 1 - this.marketSaturation;
        return Math.max(40, Math.round(this.basePrice * saturationImpact));
      }

      receiveDelivery(amount) {
        this.marketSaturation = Math.min(1, this.marketSaturation + amount / 300);
      }
    }

    class EconomySystem {
      constructor() {
        this.maintenanceCostPerSecond = 12;
        this.fuelCostPerTrip = 300;
      }

      calculateSaleRevenue(station, amount) {
        return Math.round(station.getBuyPrice() * amount);
      }
    }

    class Train {
      constructor(scene, economy, origin, destination) {
        this.scene = scene;
        this.economy = economy;
        this.origin = origin;
        this.destination = destination;
        this.state = "Loading";
        this.speed = 90;
        this.capacity = 40;
        this.reliability = 0.92;
        this.cargo = 0;
        this.progress = 0;
        this.path = [];
        this.currentLegIndex = 0;
        this.breakdownTimer = 0;
        this.sprite = scene.add.rectangle(origin.x, origin.y, 16, 10, 0xffd166).setDepth(3);
      }

      setPath(path) {
        this.path = path;
        this.currentLegIndex = 0;
        this.progress = 0;
      }

      update(delta) {
        if (this.breakdownTimer > 0) {
          this.breakdownTimer -= delta;
          return;
        }

        if (this.state === "Loading") {
          const loadAmount = Math.min(this.capacity, this.origin.stock);
          this.origin.stock -= loadAmount;
          this.cargo = loadAmount;
          this.state = "Traveling";
          this.scene.gameManager.spend(this.economy.fuelCostPerTrip);
        } else if (this.state === "Traveling") {
          this.travel(delta);
        } else if (this.state === "Unloading") {
          const revenue = this.economy.calculateSaleRevenue(this.destination, this.cargo);
          this.scene.gameManager.earn(revenue);
          this.destination.receiveDelivery(this.cargo);
          this.cargo = 0;
          const temp = this.origin;
          this.origin = this.destination;
          this.destination = temp;
          this.state = "Loading";
        }
      }

      travel(delta) {
        if (!this.path.length) {
          return;
        }
        if (Math.random() > this.reliability && Math.random() < 0.002) {
          this.breakdownTimer = 2000;
          return;
        }
        const speedPerMs = this.speed / 1000;
        this.progress += speedPerMs * delta;

        const currentFrom = this.path[this.currentLegIndex];
        const currentTo = this.path[this.currentLegIndex + 1];
        if (!currentTo) {
          this.state = "Unloading";
          return;
        }
        const dx = currentTo.x - currentFrom.x;
        const dy = currentTo.y - currentFrom.y;
        const distance = Math.hypot(dx, dy);
        const t = Math.min(1, this.progress / distance);
        this.sprite.x = currentFrom.x + dx * t;
        this.sprite.y = currentFrom.y + dy * t;

        if (t >= 1) {
          this.currentLegIndex += 1;
          this.progress = 0;
          if (this.currentLegIndex >= this.path.length - 1) {
            this.state = "Unloading";
          }
        }
      }
    }

    class GameManager {
      constructor(scene) {
        this.scene = scene;
        this.stations = [];
        this.tracks = new Map();
        this.trains = [];
        this.bank = 50000;
        this.trainCost = 20000;
        this.economy = new EconomySystem();
      }

      addStation(station) {
        this.stations.push(station);
        this.tracks.set(station.id, []);
      }

      connectStations(a, b) {
        this.tracks.get(a.id).push(b.id);
        this.tracks.get(b.id).push(a.id);
        this.scene.renderTracks(a, b);
      }

      spend(amount) {
        this.bank = Math.max(0, this.bank - amount);
      }

      earn(amount) {
        this.bank += amount;
      }

      update(delta) {
        this.stations.forEach((station) => station.produce(delta));
        this.trains.forEach((train) => train.update(delta));
        this.spend(this.trains.length * this.economy.maintenanceCostPerSecond * (delta / 1000));
      }

      buyTrain() {
        if (this.bank < this.trainCost) {
          return false;
        }
        this.spend(this.trainCost);
        const origin = this.stations[0];
        const destination = this.stations[2];
        const train = new Train(this.scene, this.economy, origin, destination);
        const path = this.findPath(origin.id, destination.id);
        train.setPath(path.map((id) => this.stations.find((s) => s.id === id)));
        this.trains.push(train);
        return true;
      }

      findPath(startId, goalId) {
        const queue = [startId];
        const cameFrom = new Map();
        cameFrom.set(startId, null);

        while (queue.length) {
          const current = queue.shift();
          if (current === goalId) {
            break;
          }
          for (const neighbor of this.tracks.get(current)) {
            if (!cameFrom.has(neighbor)) {
              cameFrom.set(neighbor, current);
              queue.push(neighbor);
            }
          }
        }

        const path = [];
        let current = goalId;
        while (current !== null) {
          path.unshift(current);
          current = cameFrom.get(current);
        }
        return path;
      }
    }

    class GameScene extends Phaser.Scene {
      constructor() {
        super("GameScene");
        this.gameManager = null;
        this.graphics = null;
      }

      create() {
        this.graphics = this.add.graphics();
        this.gameManager = new GameManager(this);

        const stations = [
          new Station(this, 1, "Lyon", 160, 180, "Bois", "Fer", 0x3cb371),
          new Station(this, 2, "Paris", 420, 120, "Charbon", "Passagers", 0xff6666),
          new Station(this, 3, "Lille", 680, 200, "Blé", "Bois", 0x6aa9ff),
          new Station(this, 4, "Bordeaux", 260, 380, "Fer", "Blé", 0xffd166),
          new Station(this, 5, "Marseille", 600, 420, "Passagers", "Charbon", 0xd17aff),
        ];

        stations.forEach((station) => {
          this.gameManager.addStation(station);
          station.sprite.on("pointerdown", () => {
            this.scene.get("UIScene").setStationDetails(station);
          });
        });

        this.gameManager.connectStations(stations[0], stations[1]);
        this.gameManager.connectStations(stations[1], stations[2]);
        this.gameManager.connectStations(stations[1], stations[3]);
        this.gameManager.connectStations(stations[3], stations[4]);
        this.gameManager.connectStations(stations[2], stations[4]);

        this.scene.launch("UIScene", { gameManager: this.gameManager });
      }

      renderTracks(a, b) {
        this.graphics.lineStyle(4, 0x4a4f61, 0.8);
        this.graphics.strokeLineShape(new Phaser.Geom.Line(a.x, a.y, b.x, b.y));
      }

      update(time, delta) {
        this.gameManager.update(delta);
      }
    }

    class UIScene extends Phaser.Scene {
      constructor() {
        super("UIScene");
        this.gameManager = null;
        this.bankEl = document.getElementById("bank-balance");
        this.shopPanel = document.getElementById("shop-panel");
        this.shopButton = document.getElementById("shop-button");
        this.buyTrainButton = document.getElementById("buy-train-button");
        this.stationDetails = document.getElementById("station-details");
      }

      create(data) {
        this.gameManager = data.gameManager;
        this.shopButton.addEventListener("click", () => {
          const isOpen = this.shopPanel.style.display === "block";
          this.shopPanel.style.display = isOpen ? "none" : "block";
        });
        this.buyTrainButton.addEventListener("click", () => {
          const success = this.gameManager.buyTrain();
          if (!success) {
            this.buyTrainButton.textContent = "Fonds insuffisants";
            setTimeout(() => {
              this.buyTrainButton.textContent = "Acheter un train";
            }, 1500);
          }
        });
        this.updateBank();
      }

      setStationDetails(station) {
        this.stationDetails.innerHTML = `
          <strong>${station.name}</strong><br/>
          Ressource produite: ${station.resource}<br/>
          Demande: ${station.demand}<br/>
          Stock actuel: ${station.stock.toFixed(0)}<br/>
          Prix du marché: ${station.getBuyPrice()} €
        `;
      }

      updateBank() {
        this.bankEl.textContent = Math.round(this.gameManager.bank).toLocaleString("fr-FR");
      }

      update() {
        this.updateBank();
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: 900,
      height: 540,
      backgroundColor: "#0f1115",
      parent: "game-container",
      scene: [GameScene, UIScene],
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
