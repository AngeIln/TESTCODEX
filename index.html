<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supply Chain Rail Tycoon - Prototype Avancé</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="hud" class="shadow-lg">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <div>
        <h1 class="hud-title">Supply Chain Rail Tycoon</h1>
        <p class="hud-subtitle">Prototype avancé · Phaser 3</p>
      </div>
      <div class="badge bg-success fs-6" id="wallet">$0</div>
    </div>

    <div class="tool-grid">
      <button class="btn btn-sm btn-outline-light tool" data-tool="rail">
        🚄 Poser Rail <span class="cost">$50</span>
      </button>
      <button class="btn btn-sm btn-outline-light tool" data-tool="station">
        🏁 Poser Gare <span class="cost">$200</span>
      </button>
      <button class="btn btn-sm btn-outline-light tool" data-tool="factory">
        🏭 Poser Usine <span class="cost">$300</span>
      </button>
      <button class="btn btn-sm btn-outline-light tool" data-tool="city">
        🏙️ Poser Ville <span class="cost">$500</span>
      </button>
      <button class="btn btn-sm btn-outline-info tool" data-tool="train">
        🚆 Acheter Train <span class="cost">$400</span>
      </button>
    </div>

    <div class="mt-3 p-2 info-panel">
      <div class="info-row"><strong>Outil actif:</strong> <span id="active-tool">Rail</span></div>
      <div class="info-row"><strong>Routes:</strong> <span id="route-info">Choisissez une gare et une ville</span></div>
      <div class="info-row"><strong>Stations:</strong> <span id="stations-count">0</span></div>
      <div class="info-row"><strong>Trains:</strong> <span id="trains-count">0</span></div>
      <div class="hint">Cliquez pour placer · Shift+Click pour définir route · Drag pour pan · Molette pour zoom</div>
    </div>

    <div class="mt-3 p-2 info-panel">
      <div class="info-row"><strong>Marché en direct</strong></div>
      <div class="info-row"><span>Bois</span><span id="price-wood">-</span></div>
      <div class="info-row"><span>Fer</span><span id="price-iron">-</span></div>
      <div class="info-row"><span>Planches</span><span id="price-planks">-</span></div>
      <canvas id="market-chart" height="140"></canvas>
    </div>
  </div>

  <div id="phaser-root"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
